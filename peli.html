<!DOCTYPE html>
<html>
<head>
    <title>PML-pelit ⦁ Sanasotku - Kehitysversio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://saunakatti.github.io/assets/images/bee-icon-256.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./sanapeli.js"></script>
</head>
<body>
    <div class="content">
        <h1>Sanasotku</h1>
        <h2>Ratkaise sotkettu sana.</h2>
        <p>Syötä vastaus painamalla rivinvaihto-painiketta (Enter). Jos pelaat puhelimella, pitkät sanat saa näkyviin sanaa vetämällä.</p>
        <div id="ShuffledWord"></div>
        <form action="" id="Form" onsubmit="submitAnswer(event)">
            <label for="Answer" style="display: none;">Vastaus</label>
            <input type="text" id="Answer" name="answer" placeholder="Syötä vastauksesi tähän">
        </form>
        <div id="Feedback"></div>
        <p class="credit">
            Kehitysversio &nbsp; Onni V 2026 &nbsp;
            <a target="_blank" href="https://saunakatti.github.io">saunakatti.github.io</a><br>
            Tekoälyä ei käytetty missään työvaiheessa.

        </p>
    </div>
</body>
</html>
